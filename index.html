<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- BJ Catalogue — installable app shell (GitHub Pages).
     It shows the LIVE catalogue (the Apps Script /exec web app) full screen inside the app,
     so the catalogue is always up to date; this shell only adds the home-screen icon,
     full-screen mode, a loading screen and an offline card. Version: see sw.js (APP_VERSION). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BJ ค้นหาสินค้า</title>
<meta name="description" content="ค้นหารหัสสินค้าหรือชื่อสินค้าในแคตตาล็อค BJ / Search the BJ catalogue by model code or product name">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#1a1414">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BJ Catalogue">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html, body { margin: 0; height: 100%; background: #1a1414; color: #f3eded;
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #1a1414;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); box-sizing: border-box; }
  .cover { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: #1a1414; text-align: center; padding: 24px; transition: opacity .35s ease; z-index: 2; }
  .cover.hide { opacity: 0; pointer-events: none; }
  .cover img { width: 112px; height: 112px; border-radius: 24px; box-shadow: 0 8px 30px rgba(200, 30, 30, .35); }
  .cover .t { font-size: 17px; font-weight: 600; }
  .cover .s { font-size: 13px; opacity: .7; }
  .spin { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.18); border-top-color: #e53935;
    border-radius: 50%; animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .btn { margin-top: 6px; padding: 12px 22px; border-radius: 999px; border: 0; background: #c81e1e; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; }
  #offline { display: none; z-index: 3; }
  #install { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: none; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-radius: 999px;
    background: rgba(26, 20, 20, .94); border: 1px solid rgba(255,255,255,.15); box-shadow: 0 6px 24px rgba(0,0,0,.45);
    font-size: 13px; z-index: 4; max-width: calc(100% - 28px); }
  #install b { color: #ff6b6b; }
  #install button { border: 0; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  #install .go { background: #c81e1e; color: #fff; }
  #install .x { background: transparent; color: #f3eded; opacity: .7; padding: 7px 8px; }
</style>
</head>
<body>
<iframe id="app" title="BJ Catalogue" allow="fullscreen; clipboard-write; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>

<div class="cover" id="loading">
  <img src="icons/icon-192.png" alt="BJ Catalogue">
  <div class="spin" aria-hidden="true"></div>
  <div class="t">กำลังเปิดแคตตาล็อก…</div>
  <div class="s">Opening the BJ catalogue…</div>
</div>

<div class="cover" id="offline" role="alert">
  <img src="icons/icon-192.png" alt="">
  <div class="t">ไม่มีอินเทอร์เน็ต</div>
  <div class="s">No internet connection — the catalogue needs internet to search.<br>แคตตาล็อกต้องใช้อินเทอร์เน็ตในการค้นหา</div>
  <button class="btn" id="retry" type="button">⟳ ลองใหม่ / Try again</button>
</div>

<div id="install" role="dialog" aria-label="Install the app">
  <span id="installText"></span>
  <button class="go" id="installGo" type="button">ติดตั้ง / Install</button>
  <button class="x" id="installX" type="button" aria-label="Close">✕</button>
</div>

<script>
(function () {
  // The live catalogue (public link — the same one the catalogue's own share preview uses).
  var LIVE = 'https://script.google.com/macros/s/AKfycbwxwu1-tkaSeVO5RzF_r6Gij5CSeTzdgTIYZvG3woD9O3cdMmCHdkobK4qbhe-Pl-o/exec';
  var app = document.getElementById('app');
  var loading = document.getElementById('loading');
  var offline = document.getElementById('offline');
  var started = false;

  function open() {
    if (!navigator.onLine) { offline.style.display = 'flex'; loading.classList.add('hide'); return; }
    offline.style.display = 'none';
    loading.classList.remove('hide');
    // Pass on ?q= etc. so a shared link like .../bj-catalogue/?q=G-OK-FG26B still works.
    app.src = LIVE + (location.search || '');
    started = true;
  }
  app.addEventListener('load', function () { if (started) setTimeout(function () { loading.classList.add('hide'); }, 250); });
  document.getElementById('retry').addEventListener('click', open);
  window.addEventListener('online', function () { if (offline.style.display === 'flex') open(); });
  window.addEventListener('offline', function () { offline.style.display = 'flex'; });
  open();

  // Offline support for the shell itself (icon, loading screen, offline card).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  // Small "install" pill: Android/desktop Chrome get a real Install button; iPhone/iPad Safari get the
  // "Share → Add to Home Screen" hint. Hidden once installed or after ✕ (remembered on this phone).
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var box = document.getElementById('install'), text = document.getElementById('installText'), go = document.getElementById('installGo');
  function dismissed() { try { return localStorage.getItem('bjInstallHidden') === '1'; } catch (e) { return false; } }
  function hide(remember) { box.style.display = 'none'; if (remember) { try { localStorage.setItem('bjInstallHidden', '1'); } catch (e) {} } }
  document.getElementById('installX').addEventListener('click', function () { hide(true); });
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    if (standalone || dismissed()) return;
    text.innerHTML = '📲 <b>BJ Catalogue</b> ลงหน้าจอโทรศัพท์';
    go.style.display = ''; box.style.display = 'flex';
  });
  go.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; hide(false); });
  });
  window.addEventListener('appinstalled', function () { hide(true); });
  var iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (iOS && !standalone && !dismissed()) {
    text.innerHTML = '📲 ติดตั้ง: กด <b>แชร์ ⬆︎</b> → <b>เพิ่มไปยังหน้าจอโฮม</b> · Share → Add to Home Screen';
    go.style.display = 'none'; box.style.display = 'flex';
  }
})();
</script>
</body>
</html>
